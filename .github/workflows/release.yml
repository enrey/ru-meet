name: "Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (auto increments the latest patch version)"
        required: true
        type: string
        default: "auto"

# Prevent duplicate releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases, fail instead

jobs:
  # STEP 1: Create draft release first
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set release version
        id: set-version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo "::error::Run Release from the branch that should receive the version commit."
            exit 1
          fi
          version_pattern='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ "$VERSION" == auto ]]; then
            current_version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
            latest_version=$(
              { printf 'v%s\n' "$current_version"; git tag --list 'v*'; } |
                grep -E "^v${version_pattern}$" | sort -V | tail -n 1
            )
            IFS=. read -r major minor patch <<< "${latest_version#v}"
            VERSION="${major}.${minor}.$((patch + 1))"
            echo "Selected $VERSION from ${latest_version#v}."
          fi
          if [[ ! "$VERSION" =~ ^${version_pattern}$ ]]; then
            echo "::error::Enter auto or a version in X.Y.Z format, for example 0.10.0."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi

          node frontend/scripts/set-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.VERSION}`,
              target_commitish: context.sha,
              name: `Ru-Meet v${process.env.VERSION}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            console.log(`Created draft release with ID: ${data.id}`)
            return data.id

  # STEP 2: Build all platforms and upload directly to release
  # Note: Linux builds are excluded from release (only macOS and Windows)
  build-all-platforms:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Apple Silicon only (M1 and above)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      ref: ${{ github.sha }}
      app-version: ${{ needs.create-release.outputs.version }}
      sign-binaries: false
      asset-prefix: "ru_meet"
      upload-artifacts: false  # tauri-action uploads directly to release
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  # STEP 3: Record the version after both builds and show the release summary
  release-summary:
    needs: [create-release, build-all-platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get release assets and latest.json
        id: release-info
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          RELEASE_ID="${{ needs.create-release.outputs.release-id }}"

          echo "## Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List all release assets
          echo "### Files in Release" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          gh api repos/${{ github.repository }}/releases/${RELEASE_ID}/assets --jq '.[] | "\(.name) (\(.size / 1048576 | floor)MB)"' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Download and show latest.json
          echo "### latest.json content" >> $GITHUB_STEP_SUMMARY
          gh release download "v${VERSION}" --pattern "latest.json" --dir . 2>/dev/null || echo "latest.json not yet available"
          if [ -f latest.json ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat latest.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Download links
          echo "### Download Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release page:** https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download all as ZIP:** https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Manual S3 upload:** Download latest.json from release and upload to \`s3://meetily-updates/latest.json\`" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Commit release version and update draft
        id: commit-version
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node frontend/scripts/set-version.mjs "$VERSION"
          git add -- Cargo.lock frontend/package.json frontend/src-tauri/Cargo.toml frontend/src-tauri/tauri.conf.json

          release_commit="$GITHUB_SHA"
          push_version=false
          if ! git diff --cached --quiet; then
            git fetch origin "$GITHUB_REF"
            branch_tip=$(git rev-parse FETCH_HEAD)
            if [[ "$branch_tip" == "$GITHUB_SHA" ]]; then
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit -m "Bump version to $VERSION"
              release_commit=$(git rev-parse HEAD)
              push_version=true
            elif [[ "$(git show -s --format=%P "$branch_tip")" == "$GITHUB_SHA" &&
                    "$(git rev-parse "$branch_tip^{tree}")" == "$(git write-tree)" ]]; then
              # A previous attempt already pushed the same version commit.
              release_commit="$branch_tip"
            else
              echo "::error::The branch advanced during the release build. Start Release again from its current tip."
              exit 1
            fi
          fi

          tag_commit=$(git rev-parse --verify --quiet "refs/tags/v${VERSION}^{commit}" || true)
          if [[ -n "$tag_commit" && "$tag_commit" != "$release_commit" ]]; then
            echo "::error::Tag v${VERSION} already points to a different commit."
            exit 1
          fi

          if [[ "$push_version" == true ]]; then
            git push origin "${release_commit}:${GITHUB_REF}"
          fi
          if [[ -z "$tag_commit" ]]; then
            # Pass tag_name too: patching a draft without it resets the tag to
            # "untagged-...", and the release is then published without v${VERSION}.
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -f tag_name="v${VERSION}" \
              -f target_commitish="$release_commit" --silent
          fi
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Release Summary
        run: |
          echo "============================================"
          echo "=== Release Created Successfully ==="
          echo "============================================"
          echo "Version: v${{ needs.create-release.outputs.version }}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }}"
          echo ""
          echo "Uploaded assets (via tauri-action):"
          echo "  - macOS: DMG installer + app.tar.gz (for updater) + .sig"
          echo "  - Windows: unsigned MSI + NSIS installers + .sig files"
          echo "  - Updater manifest: latest.json (auto-generated by tauri-action)"
          echo ""
          echo "Next steps:"
          echo "  1. Review the draft release"
          echo "  2. Edit release notes if needed"
          echo "  3. Publish the release when ready"
          echo "============================================"

          # Add to GitHub Step Summary
          echo "## Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source commit:** ${{ steps.commit-version.outputs.commit }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Assets |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **macOS** | DMG installer, app.tar.gz (updater), .sig |" >> $GITHUB_STEP_SUMMARY
          echo "| **Windows** | Unsigned MSI installer, unsigned NSIS installer, .sig files |" >> $GITHUB_STEP_SUMMARY
          echo "| **Updater** | latest.json manifest (auto-generated by tauri-action) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. [Review the draft release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "2. Edit release notes if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. Publish the release when ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
