[workspace]
resolver = "2"
members = [
    "crates/ndarray-linalg-nalgebra",
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Workspace-level patches apply to every member.
[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
# `speakrs` uses `ndarray-linalg` for two matrix inversions and one generalized
# symmetric eigenproblem, and nothing else. The real crate would drag in a BLAS
# backend for that: a downloaded Intel MKL blob on x86_64 and an OpenBLAS build
# from source - so a Fortran compiler - on Apple Silicon. `crates/
# ndarray-linalg-nalgebra` implements those three operations on nalgebra
# instead, keeping the build pure Rust on both release targets.
ndarray-linalg = { path = "crates/ndarray-linalg-nalgebra" }
# Released `polyvoice` refuses any recording over one hour - a hard-coded
# `MAX_AUDIO_SAMPLES` its own comment describes as a guard against untrusted
# buffers reaching the C FFI and Python bindings, which is not how Meetily calls
# it. The constant is read directly at the check site and the pipeline's stages
# are private, so it cannot be overridden from outside the crate.
#
# This points at our fork's branch for
# https://github.com/ekhodzitsky/polyvoice/pull/94, which turns the cap into
# `PipelineConfig::max_audio_samples` (default unchanged). `diarization.rs`
# raises it through the builder. Pinned by `rev` so the build is reproducible
# even if the branch moves.
#
# When the PR is merged and released, delete this entry and bump the version in
# `frontend/src-tauri/Cargo.toml`; the builder call stays as it is.
polyvoice = { git = "https://github.com/enrey/polyvoice", rev = "c098fd31e28e0e2a8b093c21fcade7902d3a3cbd" }

# Keep development builds compact and fast while retaining line information
# for useful backtraces.
[profile.dev]
debug = 1
incremental = true

# Diarization uses CPU-heavy hand-written INT8 kernels. Keep them optimized
# during `tauri dev`; otherwise a short recording can take minutes to process.
# (Now subsumed by the `"*"` glob below, but kept explicit so the reason these
# particular crates must never drop back to opt-level 0 stays recorded.)
[profile.dev.package.polyvoice]
opt-level = 3

[profile.dev.package.polyvoice-kernels]
opt-level = 3

[profile.dev.package.rten-gemm]
opt-level = 3

[profile.dev.package.rten-tensor]
opt-level = 3

# The same problem is not specific to diarization: the whole audio-import
# pipeline is CPU-bound Rust, and `tauri dev` builds it at opt-level 0.
# Measured on a 70-minute recording (Ryzen 5 3600): the import took 1016s, of
# which only ~380s was attributable to work that is optimized regardless -
# ffmpeg (18s), ONNX inference inside onnxruntime.dll (GigaAM ~330s, Silero
# VAD ~29s). The remaining ~635s was unoptimized Rust: `compute_mel`,
# `ctc_greedy_decode`, `audio_to_mono`, `normalize_audio_samples` and the VAD
# ring buffer in this workspace, plus `rubato`/`rustfft`/`ndarray`/`symphonia`
# as dependencies. For reference, the 48kHz->16kHz resample alone measured
# 4.2s compiled at opt-level 3 against tens of seconds at opt-level 0.
#
# Dependencies get full optimization - we never step through them anyway.
[profile.dev.package."*"]
opt-level = 3

# Our own crate stays at 1: that already removes the bulk of the debug-build
# penalty in the numeric loops while keeping backtraces and stepping usable
# and incremental rebuilds fast. Raise to 2 or 3 if the import path still
# shows up in a stage-timing summary (see `audio/import.rs`).
[profile.dev.package.meetily]
opt-level = 1
